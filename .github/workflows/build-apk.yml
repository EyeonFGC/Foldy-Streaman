# Foldy Streaman: builds the APK on every push. Download it from the Actions tab
# (open the newest run, scroll to "Artifacts", tap FoldyStreaman-apk).
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # Optional: with the FOLDY_KEYSTORE_B64 and FOLDY_KEY_PASSWORD secrets set, every build is
      # signed with the same key, so new APKs install over old ones without losing your tapes.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.FOLDY_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/foldy.jks"
          echo "FOLDY_KEYSTORE=$RUNNER_TEMP/foldy.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          FOLDY_KEY_PASSWORD: ${{ secrets.FOLDY_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -x lint
      - uses: actions/upload-artifact@v4
        with:
          name: FoldyStreaman-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
